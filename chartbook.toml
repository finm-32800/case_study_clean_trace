[project]
name = "Clean TRACE"
description = "Corporate bond TRACE data cleaning pipeline (Dick-Nielsen methodology)"
contributors = [
    "Jeremiah Bejarano",
]
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]
requires_chartbook = ">=0.4.0"

[notebooks.01_data_sources_overview]
name = "Data Sources Overview"
description = "Quick look at each raw dataset pulled by the pipeline."
path = "_output/01_data_sources_overview_ipynb.ipynb"

[notebooks.02_trace_cleaning_walkthrough]
name = "TRACE Cleaning Walkthrough"
description = "1-hour lecture walkthrough of the TRACE corporate bond data cleaning pipeline."
path = "_output/02_trace_cleaning_walkthrough_ipynb.ipynb"

[dataframes.stage0_enhanced]
name = "Stage 0: Enhanced TRACE Daily Panel"
description = "Clean daily bond prices from Enhanced TRACE (2002-present), Dick-Nielsen methodology."
sources = [
    "WRDS TRACE Enhanced",
]
providers = [
    "FINRA via WRDS",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "Corporate Bonds",
    "TRACE",
    "Daily Prices",
]
pull_method = "SQL via wrds Python package"
path = "./_data/stage0/enhanced/year=*/month=*/data.parquet"
date_col = "trd_exctn_dt"
docs_path = "./docs_src/dataframes/stage0_enhanced.md"

[dataframes.stage0_standard]
name = "Stage 0: Standard TRACE Daily Panel"
description = "Clean daily bond prices from Standard TRACE (2024-present), Dick-Nielsen methodology."
sources = [
    "WRDS TRACE Standard",
]
providers = [
    "FINRA via WRDS",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "Corporate Bonds",
    "TRACE",
    "Daily Prices",
]
pull_method = "SQL via wrds Python package"
path = "./_data/stage0/standard/year=*/month=*/data.parquet"
date_col = "trd_exctn_dt"
docs_path = "./docs_src/dataframes/stage0_standard.md"

[dataframes.stage0_144a]
name = "Stage 0: Rule 144A TRACE Daily Panel"
description = "Clean daily bond prices from Rule 144A TRACE (2002-present), Dick-Nielsen methodology."
sources = [
    "WRDS TRACE 144A",
]
providers = [
    "FINRA via WRDS",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "Corporate Bonds",
    "TRACE",
    "Daily Prices",
]
pull_method = "SQL via wrds Python package"
path = "./_data/stage0/144a/year=*/month=*/data.parquet"
date_col = "trd_exctn_dt"
docs_path = "./docs_src/dataframes/stage0_144a.md"

[dataframes.stage1]
name = "Stage 1: Enriched Daily Bond Analytics"
description = "Daily bond dataset with QuantLib analytics, FISD characteristics, credit ratings, equity identifiers, and Fama-French industries."
sources = [
    "WRDS TRACE",
    "WRDS FISD",
    "WRDS Ratings",
    "Liu-Wu Yields",
    "OSBAP Linker",
]
providers = [
    "FINRA via WRDS",
    "Mergent via WRDS",
    "S&P/Moody's via WRDS",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
    "https://openbondassetpricing.com/",
]
tags = [
    "Corporate Bonds",
    "Bond Analytics",
    "Duration",
    "Credit Spreads",
    "Ratings",
]
pull_method = "SQL via wrds Python package + web downloads"
path = "./_data/stage1/stage1_*.parquet"
date_col = "trd_exctn_dt"
docs_path = "./docs_src/dataframes/stage1.md"

[scripts]
build = "doit"
